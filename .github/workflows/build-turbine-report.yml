name: Build Turbine Report PDF

on:
  push:
    branches:
      - turbine-model
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-pdf:
    if: ${{ !contains(github.event.head_commit.message, '[skip pdf4]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: turbine-model
          fetch-depth: 0

      - name: Compile turbine report
        uses: xu-cheng/latex-action@v3
        with:
          root_file: report_04_turbine_models.tex
          working_directory: docs

      - name: Commit compiled PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/report_04_turbine_models.pdf
          if git diff --cached --quiet; then
            echo "PDF unchanged"
          else
            git commit -m "Build Turbine Report 4 PDF [skip pdf4]"
            git push origin turbine-model
          fi
