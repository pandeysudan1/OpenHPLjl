name: FCR Study 01

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fcr-study01.yml'
      - 'Project.toml'
      - 'src/**'
      - 'examples/FCR/**'

jobs:
  study01:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Julia 1.12
        uses: julia-actions/setup-julia@v2
        with:
          version: '1.12'

      - name: Cache Julia packages
        uses: julia-actions/cache@v2

      - name: Instantiate project
        run: julia --project=. -e 'using Pkg; Pkg.instantiate()'

      - name: Run FCR Study 01
        shell: bash
        run: |
          set -o pipefail
          julia --startup-file=no --project=. examples/FCR/run.jl 2>&1 | tee study01.log

      - name: Upload Study 01 log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fcr-study01-log
          path: study01.log
          if-no-files-found: warn
