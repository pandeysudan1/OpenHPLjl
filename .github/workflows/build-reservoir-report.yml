name: Build Reservoir Report PDF

on:
  push:
    branches:
      - reservoir-model
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-pdf:
    if: ${{ github.event_name == 'pull_request' || !contains(github.event.head_commit.message, '[skip pdf]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Reservoir branch
        uses: actions/checkout@v4
        with:
          ref: reservoir-model
          fetch-depth: 0

      - name: Compile LaTeX report
        uses: xu-cheng/latex-action@v3
        with:
          root_file: report_01_reservoir.tex
          working_directory: docs

      - name: Commit compiled PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/report_01_reservoir.pdf
          if git diff --cached --quiet; then
            echo "PDF unchanged"
          else
            git commit -m "Build Reservoir Report 1 PDF [skip pdf]"
            git push origin reservoir-model
          fi
