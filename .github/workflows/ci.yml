name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.12'
      - uses: julia-actions/cache@v2
      - name: Instantiate
        run: julia --project=. -e 'using Pkg; Pkg.instantiate()'
      - name: Test
        run: julia --project=. -e 'using Pkg; Pkg.test()'
      - name: Run hydraulic example
        run: julia --project=. examples/reservoir_pipe.jl
      - name: Run droop FCR example
        run: julia --project=. examples/fcr_load_step.jl
      - name: Run transient-droop FCR example
        run: julia --project=. examples/fcr_transient_droop.jl
